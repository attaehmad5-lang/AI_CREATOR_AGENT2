name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.5.11"
  AI_CREATOR_PROFILE: test
  AI_CREATOR_RUNTIME: ci

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Check required project inputs
        run: |
          test -f pyproject.toml
          test -f uv.lock
          test -f src/ai_creator_agent/__init__.py
      - name: Install pinned Python
        run: uv python install "$(tr -d '[:space:]' < .python-version)"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Sync locked dependencies
        run: make sync
      - name: Diagnose environment
        run: make diagnose
      - name: Run quality and security gates
        run: make ci

  container:
    runs-on: ubuntu-22.04
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Test container stage
        run: make docker-test
      - name: Build hardened runtime
        run: make docker-build
