name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.5.11"
  AI_CREATOR_PROFILE: test
  AI_CREATOR_RUNTIME: ci

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Check required project inputs
        run: |
          test -f pyproject.toml
          test -f src/ai_creator_agent/__init__.py
          test -f .python-version
      - name: Install pinned Python
        run: uv python install "$(tr -d '[:space:]' < .python-version)"
      - name: Ensure ffmpeg is available
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Generate and validate dependency lock
        run: |
          python_version="$(tr -d '[:space:]' < .python-version)"
          cp uv.lock "$RUNNER_TEMP/uv.lock.before"
          uv lock --upgrade-package pytest --python "$python_version"
          diff -u "$RUNNER_TEMP/uv.lock.before" uv.lock || true
          uv lock --check --python "$python_version"
      - name: Preserve generated lockfile as CI artifact
        if: always() && hashFiles('uv.lock') != ''
        uses: actions/upload-artifact@v4
        with:
          name: generated-uv-lock-${{ github.run_id }}
          path: uv.lock
          if-no-files-found: error
          retention-days: 7
      - name: Sync locked dependencies
        run: make sync
      - name: Diagnose environment
        run: make diagnose
      - name: Run quality and security gates
        run: make ci

  container:
    runs-on: ubuntu-22.04
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Test container stage
        run: make docker-test
      - name: Build hardened runtime
        run: make docker-build
